paths:
  /api/loggerTest:
    get:
      summary: Probar los niveles del logger
      description: >
        Dispara los 6 niveles del logger (debug, http, info, warning, error, fatal) para
        verificar que la configuración de Winston funciona correctamente. No representa una
        funcionalidad de negocio de ShipNow: es una herramienta interna de diagnóstico para
        confirmar que la consola y el archivo rotado de errores reciben los logs esperados.
      tags:
        - Logger
      responses:
        "200":
          description: Logs generados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logs generados correctamente
