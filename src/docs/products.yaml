paths:
  /api/products:
    post:
      summary: Crear un producto
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - descripcion
                - precio
              properties:
                nombre:
                  type: string
                  example: Zapatillas running
                descripcion:
                  type: string
                  example: Zapatillas para correr, talle 42
                precio:
                  type: number
                  example: 15000
                stock:
                  type: number
                  example: 10
      responses:
        "201":
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        "400":
          description: El precio debe ser mayor a cero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Obtener todos los productos (paginado)
      tags:
        - Products
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página (por defecto 1)
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          description: Cantidad de resultados por página (por defecto 10)
          schema:
            type: integer
            example: 10
      responses:
        "200":
          description: Lista de productos obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Producto'
                  total:
                    type: integer
                    example: 100
                  page:
                    type: integer
                    example: 1
                  totalPages:
                    type: integer
                    example: 10
                    
  /api/products/{id}:
    get:
      summary: Obtener un producto por ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66a1234567890abcdef12345
      responses:
        "200":
          description: Producto obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Actualizar un producto por ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66a1234567890abcdef12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: Zapatillas running
                descripcion:
                  type: string
                  example: Zapatillas para correr, talle 40
                precio:
                  type: number
                  example: 85000
                stock:
                  type: number
                  example: 80
      responses:
        "200":
          description: Producto actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar un producto por ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66a1234567890abcdef12345
      responses:
        "200":
          description: Producto eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
