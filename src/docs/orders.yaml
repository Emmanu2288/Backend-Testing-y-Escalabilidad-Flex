paths:
  /api/orders:
    post:
      summary: Crear un pedido
      description: El total se calcula en el Service a partir de los items enviados, no se recibe directamente del cliente.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cliente
                - items
              properties:
                cliente:
                  type: string
                  description: ID de un usuario con rol cliente
                  example: 66a1234567890abcdef12300
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ItemPedido'
      responses:
        "201":
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        "404":
          description: El cliente indicado no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Obtener todos los pedidos (paginado)
      tags:
        - Orders
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página (por defecto 1)
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          description: Cantidad de resultados por página (por defecto 10)
          schema:
            type: integer
            example: 10
      responses:
        "200":
          description: Lista de pedidos obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pedido'
                  total:
                    type: number
                    example: 20
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 2

  /api/orders/{id}:
    get:
      summary: Obtener un pedido por ID
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66a1234567890abcdef12345
      responses:
        "200":
          description: Pedido obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Actualizar un pedido por ID
      description: Se usa, por ejemplo, para cambiar el estado del pedido (creado, asignado, retirado, en_transito, entregado, cancelado).
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66a1234567890abcdef12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  enum: [creado, asignado, retirado, en_transito, entregado, cancelado]
                  example: asignado
      responses:
        "200":
          description: Pedido actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar un pedido por ID
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 66a1234567890abcdef12345
      responses:
        "200":
          description: Pedido eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/proof:
    post:
      summary: Subir un comprobante de entrega para un pedido
      description: Recibe un archivo y lo asocia al pedido indicado como comprobante. Solo se guardan los metadatos del archivo en la base de datos; el archivo en sí queda en el servidor, dentro de uploads/proofs.
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
            example: 66a1234567890abcdef12345
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - proof
              properties:
                proof:
                  type: string
                  format: binary
                  description: Archivo del comprobante. Tipos permitidos - application/pdf, image/jpeg, image/png, image/webp. Tamaño máximo - 5MB.
      responses:
        "200":
          description: Comprobante cargado y asociado al pedido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        "400":
          description: Falta el archivo (FILE_REQUIRED), el tipo de archivo no está permitido (INVALID_FILE_TYPE) o supera el tamaño máximo (FILE_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
